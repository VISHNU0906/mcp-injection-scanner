[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-injection-scanner"
version = "0.3.1"
description = "Security scanner for Model Context Protocol servers — detects prompt injection, tool hijacking, parameter pollution, and resource-borne attacks"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vishnu Kosuri", email = "vishnu@aresredteam.com" }]
keywords = ["mcp", "security", "prompt-injection", "llm", "ai-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "jsonschema>=4.22.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
]

[project.scripts]
mcp-scan = "mcp_injection_scanner.cli:app"

[project.urls]
Homepage = "https://github.com/VISHNU0906/mcp-injection-scanner"
Repository = "https://github.com/VISHNU0906/mcp-injection-scanner"
Issues = "https://github.com/VISHNU0906/mcp-injection-scanner/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=mcp_injection_scanner --cov-report=term-missing --cov-fail-under=80"
